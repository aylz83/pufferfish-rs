[package]
name = "pufferfish"
version = "0.2.1"
edition = "2024"
license = "MIT"
readme = "README.md"
keywords = ["sequencing", "bioinformatics"]
authors = ["Eilidh Ward"]
categories = ["science", "filesystem"]
description = "A bgzip (and by extension, can read bam, bed, and tabix) and zlib (such as bigBed) block decompression trait for tokio and rayon"
repository = "https://github.com/aylz83/pufferfish-rs"

[dependencies]
async-compression = { version = "0.4.50", features = ["tokio"] }
crossbeam = { version = "0.8.5", features = ["crossbeam-queue"] }
futures = "0.3.34"
libdeflater = { version = "1.26.1", optional = true }
# futures-core = { version = "0.3.32", optional = true }
rayon = { version = "1.12.0", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }

[features]
default = ["bgzf-async"]
bgzf-async = ["async-compression/gzip"]
bgzf-stream = ["dep:rayon", "dep:libdeflater"]
zlib = ["async-compression/zlib"]
